<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f54"><link rel="manifest" href="manifest.json">
<title>بيت الشام | دفتر الديون</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#17221d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
header{background:linear-gradient(135deg,#174f3d,#2d8666);color:#fff;padding:28px 18px 34px;border-radius:0 0 28px 28px}
.wrap{max-width:760px;margin:auto;padding:0 15px}h1{margin:0;font-size:27px}.sub{opacity:.9;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:-22px}.card{background:#fff;border-radius:18px;padding:17px;box-shadow:0 7px 25px #00000012}.label{font-size:13px;color:#69756f}.num{font-size:24px;font-weight:900;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}button{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#1f6f54;color:#fff}.light{background:#fff;color:#1f6f54;border:1px solid #dce5e1}
.search{width:100%;padding:14px;border:1px solid #d9e1dd;border-radius:14px;background:#fff;font-size:15px;outline:none}.customer{background:#fff;margin:11px 0;padding:15px;border-radius:17px;box-shadow:0 4px 16px #00000009}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:17px;font-weight:900}.phone{font-size:12px;color:#78837e;margin-top:3px}.debt{font-weight:900;color:#c43e35}.clear{font-weight:900;color:#16804f}.tools{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}.small{padding:9px 10px;font-size:12px;background:#eef5f1;color:#1f6f54}.empty{text-align:center;padding:35px;color:#75817b}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:23px 23px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}input,textarea,select{width:100%;padding:13px;border:1px solid #d7e0dc;border-radius:12px;font-size:15px;margin:7px 0 12px}label{font-size:13px;font-weight:800}.tw{display:flex;gap:8px}.tw>*{flex:1}.hist{padding:11px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.install{margin:14px 0;padding:13px;border-radius:14px;background:#e9f5ef;color:#155a42;font-size:13px}
</style></head><body>
<header><div class="wrap"><h1>🏪 بيت الشام</h1><div class="sub">دفتر الديون — إدارة حسابات الزبائن بسهولة</div></div></header>
<main class="wrap">
<div class="stats"><div class="card"><div class="label">إجمالي الديون</div><div class="num" id="total">0 دج</div></div><div class="card"><div class="label">الزبائن المدينون</div><div class="num" id="count">0</div></div></div>
<div class="actions"><button class="primary" onclick="addCustomer()">➕ إضافة زبون</button><button class="light" onclick="payment()">💵 تسجيل تسديد</button></div>
<div class="install">📱 يمكنك إضافة الموقع إلى الشاشة الرئيسية في iPhone أو Android ليعمل كتطبيق.</div>
<input class="search" id="search" oninput="render()" placeholder="🔎 ابحث عن اسم الزبون أو الهاتف">
<div id="list"></div></main>

<div class="modal" id="modal"><div class="sheet"><h2 id="title"></h2><div id="body"></div><div class="tw"><button class="light" onclick="closeM()">إلغاء</button><button class="primary" id="ok">حفظ</button></div></div></div>
<script>
const K="beit_alsham_debts";let db=JSON.parse(localStorage.getItem(K)||'{"customers":[]}');
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('ar-DZ').format(Math.round(n))+" دج";
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function c(id){return db.customers.find(x=>x.id===id)}
function bal(x){return x.tx.reduce((s,t)=>s+(t.type==="debt"?t.amount:-t.amount),0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openM(t,b,fn){$("title").textContent=t;$("body").innerHTML=b;$("ok").onclick=fn;$("modal").classList.add("show")}
function closeM(){$("modal").classList.remove("show")}
function addCustomer(id=null){let x=id?c(id):null;openM(x?"تعديل بيانات الزبون":"إضافة زبون",`<label>اسم الزبون</label><input id="n" value="${esc(x?.name||"")}" placeholder="مثال: محمد"><label>رقم الهاتف</label><input id="p" value="${esc(x?.phone||"")}" inputmode="tel" placeholder="05xxxxxxxx"><label>ملاحظة</label><textarea id="nt">${esc(x?.note||"")}</textarea>`,()=>{if(!n.value.trim())return alert("أدخل اسم الزبون");if(x){x.name=n.value.trim();x.phone=p.value.trim();x.note=nt.value.trim()}else db.customers.push({id:Date.now().toString(),name:n.value.trim(),phone:p.value.trim(),note:nt.value.trim(),tx:[]});save();closeM()})}
function debt(id){let x=c(id);openM("تسجيل دين — "+x.name,`<label>المبلغ</label><input id="a" type="number" inputmode="decimal" placeholder="مثال: 2500"><label>ملاحظة</label><textarea id="nt" placeholder="المشتريات أو السبب"></textarea>`,()=>{let v=+a.value;if(v<=0)return alert("أدخل مبلغًا صحيحًا");x.tx.push({type:"debt",amount:v,date:new Date().toISOString(),note:nt.value});save();closeM()})}
function payment(id){let choices=db.customers.filter(x=>bal(x)>0);if(id)return payFor(c(id));if(!choices.length)return alert("لا توجد ديون مستحقة");openM("تسجيل تسديد",`<label>الزبون</label><select id="who">${choices.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(bal(x))}</option>`).join("")}</select><label>المبلغ</label><input id="a" type="number" inputmode="decimal" placeholder="المبلغ المدفوع">`,()=>{payFor(c(who.value),+a.value)})}
function payFor(x,v){if(v===undefined){closeM();openM("تسديد — "+x.name,`<label>المبلغ</label><input id="a" type="number" inputmode="decimal" placeholder="المبلغ المدفوع">`,()=>{let n=+a.value;if(n<=0||n>bal(x))return alert("تحقق من المبلغ");x.tx.push({type:"payment",amount:n,date:new Date().toISOString(),note:"تسديد"});save();closeM()});return}let n=v;if(n<=0||n>bal(x))return alert("تحقق من المبلغ");x.tx.push({type:"payment",amount:n,date:new Date().toISOString(),note:"تسديد"});save();closeM()}
function history(id){let x=c(id);let rows=x.tx.slice().reverse().map(t=>`<div class="hist"><span>${t.type==="debt"?"دين":"تسديد"}<small> ${new Date(t.date).toLocaleDateString("ar-DZ")}</small></span><b class="${t.type==="debt"?"debt":"clear"}">${t.type==="debt"?"+":"-"}${money(t.amount)}</b></div>`).join("")||"<p>لا توجد عمليات</p>";openM("كشف حساب — "+esc(x.name),`<h3>الرصيد: ${money(Math.max(0,bal(x)))}</h3>${rows}`,()=>closeM())}
function share(id){let x=c(id),s=`بيت الشام — كشف حساب\\nالزبون: ${x.name}\\n\\n`;x.tx.forEach(t=>s+=`${t.type==="debt"?"دين":"تسديد"}: ${money(t.amount)} — ${new Date(t.date).toLocaleDateString("ar-DZ")}\\n`);s+=`\\nالرصيد المتبقي: ${money(Math.max(0,bal(x)))}`;if(navigator.share)navigator.share({title:"كشف حساب بيت الشام",text:s});else navigator.clipboard.writeText(s).then(()=>alert("تم نسخ الكشف"))}
function render(){let q=$("search").value.toLowerCase(),arr=db.customers.filter(x=>(x.name+" "+x.phone).toLowerCase().includes(q));let total=arr.reduce((s,x)=>s+Math.max(0,bal(x)),0);$("total").textContent=money(total);$("count").textContent=arr.filter(x=>bal(x)>0).length;$("list").innerHTML=arr.length?arr.map(x=>`<div class="customer"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="phone">${esc(x.phone||"لا يوجد رقم")}</div></div><div class="${bal(x)>0?"debt":"clear"}">${money(Math.max(0,bal(x)))}</div></div><div class="tools"><button class="small" onclick="debt('${x.id}')">➕ دين</button><button class="small" onclick="payment('${x.id}')">💵 تسديد</button><button class="small" onclick="history('${x.id}')">📋 كشف</button><button class="small" onclick="share('${x.id}')">📤 مشاركة</button><button class="small" onclick="addCustomer('${x.id}')">✏️</button></div></div>`).join(""):"<div class='empty'>لا يوجد زبائن بعد<br>اضغط «إضافة زبون» للبدء</div>"}
render();
</script></body></html>
